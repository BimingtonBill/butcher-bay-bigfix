; BigFix default settings, shipped in the release zip and written next to
; BigFix.asi by the installers. Edit the copy in System\Win64_AMD64 and restart
; the game. Every key is optional: a missing key takes the default below.
[BigFix]
RawMouse=1
TextureSizeFix=1
FixMiscBugs=1
Enable20PlusPlusAnyGpu=1
; Keep each light inside its freshly copied shadow-mask scissor during Eyeshine.
EyeshineFix=1
; Diagnostics override EyeshineFix: 0=original, 1..6=probes, 7=fix.
; TraceShadowPass=1 enables F9 cycling 0..7, including from the initial 0.
EyeshineFixVariant=0
EyeshineFlickerWorkaround=0
; TraceShadowPass=1: F11 samples 4 detailed/16 compact frames; bursts log PNG indexes.
; DumpShaders=1 additionally saves shader sources.
DisplayModeFilter=1
HudAspectFix=1
; Horizontal degrees at 4:3 equivalent (60..120); 0 keeps the original camera.
FOV=0
VideoAspectFix=1
; Skip startup logo movies and static splash screens; story videos stay enabled.
SkipLogoVideos=1
BackgroundAudio=0
; Diagnostic only: bounded DirectSound/EAX property trace; does not enable EAX.
TraceEax=0
AntiAliasing=0
WindowMode=borderless
CaptureKey=F12
CapturePng=1
FrameCap=0
